<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <style>
        :root { --line:#e5e7eb; --muted:#6b7280; --text:#1f2937; --bg:#f6f7f9; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); }
        main { max-width: 380px; margin: 48px auto; padding: 0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
        h1 { font-size:22px; margin:0 0 18px; }
        label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
        input[type=text], input[type=password] { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
        button { width:100%; margin-top:18px; border:none; background:#2563eb; color:#fff; border-radius:8px; padding:11px; cursor:pointer; font-size:15px; }
        .msg { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:12px; display:none; }
        .msg.err { background:#fee2e2; color:#991b1b; display:block; }
        .msg.ok { background:#dcfce7; color:#166534; display:block; }
        .sub { text-align:center; font-size:14px; color:var(--muted); margin-top:16px; }
        .sub a { color:#2563eb; }
    </style>
</head>
<body>
<nav id="nav"></nav>
<main>
    <div class="card">
        <h1>로그인</h1>
        <div class="msg" id="msg"></div>
        <form method="post" action="/login" id="form">
            <input type="hidden" name="_csrf" id="csrf">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">로그인</button>
        </form>
        <p class="sub">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
    </div>
</main>
<script src="/js/nav.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById('msg');
    if (params.has('error')) { msg.className = 'msg err'; msg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.'; }
    if (params.has('signup')) { msg.className = 'msg ok'; msg.textContent = '가입이 완료되었습니다. 로그인하세요.'; }
    // 폼 전송 직전에 CSRF 토큰을 담음
    document.getElementById('form').addEventListener('submit', () => {
        document.getElementById('csrf').value = csrfToken();
    });
</script>
</body>
</html>
