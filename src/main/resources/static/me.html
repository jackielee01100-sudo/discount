<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나의 정보</title>
    <style>
        :root { --line:#e5e7eb; --muted:#6b7280; --text:#1f2937; --bg:#f6f7f9; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); }
        main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 22px; margin: 0 0 6px; }
        .desc { color:var(--muted); font-size:14px; margin:0 0 16px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
        .card h2 { font-size:15px; margin:0 0 12px; }
        .options { display:flex; flex-wrap:wrap; gap:10px; }
        .chip { display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px;
                border:1px solid var(--line); cursor:pointer; user-select:none; font-size:15px; min-width:110px; }
        .chip:has(input:checked) { border-color:#2563eb; background:#eff6ff; }
        .chip input { width:16px; height:16px; margin:0; }
        .actions { display:flex; align-items:center; gap:12px; }
        button { border:1px solid #2563eb; background:#2563eb; color:#fff; border-radius:6px; padding:8px 18px; cursor:pointer; font-size:14px; }
        .msg { font-size:14px; color:#16a34a; }
        .msg.err { color:#dc2626; }
        .empty { color:var(--muted); font-size:14px; }
        code { background:#f3f4f6; padding:1px 5px; border-radius:4px; }
    </style>
</head>
<body>
<nav id="nav" data-active="me"></nav>
<script src="/js/nav.js"></script>
<main>
    <h1>나의 정보</h1>
    <p class="desc">사용 중인 서비스를 고르면 달력·지도에 해당 서비스의 할인만 보여요. 아무것도 고르지 않으면 전체가 보여요.</p>

    <div id="groups"><div class="card empty">불러오는 중…</div></div>

    <div class="actions">
        <button type="button" id="saveBtn">저장</button>
        <span class="msg" id="msg"></span>
    </div>
</main>

<script>
    const groupsBox = document.getElementById('groups');
    const msg = document.getElementById('msg');

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
        const [providers, mine] = await Promise.all([
            fetch('/api/providers').then(r => r.json()),
            fetch('/api/me/services').then(r => r.json())
        ]);
        if (providers.length === 0) {
            groupsBox.innerHTML = '<div class="card empty">선택할 서비스가 없습니다. DB의 <code>service_provider</code> 테이블에 등록하세요.</div>';
            return;
        }
        // 분류(category)별로 묶기
        const groups = {};
        providers.forEach(p => (groups[p.category] ??= []).push(p));

        groupsBox.innerHTML = '';
        Object.entries(groups).forEach(([category, list]) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h2>${esc(category)}</h2><div class="options">`
                + list.map(p => `<label class="chip"><input type="checkbox" value="${p.id}" ${mine.includes(p.id) ? 'checked' : ''}>${esc(p.name)}</label>`).join('')
                + '</div>';
            groupsBox.appendChild(card);
        });
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const ids = [...groupsBox.querySelectorAll('input:checked')].map(cb => Number(cb.value));
        msg.className = 'msg';
        try {
            const res = await fetch('/api/me/services', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': csrfToken() },
                body: JSON.stringify(ids)
            });
            if (!res.ok) throw new Error();
            msg.textContent = '저장했습니다.';
        } catch {
            msg.className = 'msg err';
            msg.textContent = '저장에 실패했습니다.';
        }
    });

    load().catch(() => groupsBox.innerHTML = '<div class="card empty">데이터를 불러오지 못했습니다.</div>');
</script>
</body>
</html>
