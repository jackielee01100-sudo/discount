spring.application.name=discount

# PostgreSQL (docker-compose.yml 의 discount-postgres 컨테이너)
spring.datasource.url=jdbc:postgresql://localhost:5432/discount
spring.datasource.username=discount
spring.datasource.password=discount

# JPA: 엔티티 기준으로 테이블 자동 생성/변경 (개발용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
